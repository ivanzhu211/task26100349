[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageperf"
version = "0.1.0"
description = "Page performance metrics (FCP/LCP/CLS/TBT/TTI) computed from headless-browser event records"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pageperf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
